[build]
  command = "npm install && node build-schema.js && node build-blog.js && node build-reviews.js"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "nft"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Anti-clone (02/10/2026): blocca il proxy saramoreyoga.lol, vedi netlify/edge-functions/osserva.js
[[edge_functions]]
  path = "/*"
  function = "osserva"
