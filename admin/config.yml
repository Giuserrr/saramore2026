backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "data"
    label: "Gestione Sito"
    files:
      - name: "classes"
        label: "Gestione Classi"
        file: "classes.json"
        fields:
          - name: "classes"
            label: "Lista Classi"
            widget: "list"
            fields:
              - {label: "Nome Classe", name: "name", widget: "string"}
              - {label: "Giorno (es. Lunedì)", name: "day", widget: "select", options: ["Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato", "Domenica"]}
              - {label: "Orario (es. 09:00 - 10:15)", name: "time", widget: "string"}
              - {label: "Sede", name: "location", widget: "select", options: ["Piazza Alessi 2/3 — Studio Equilibra"]}
              - {label: "Posti Massimi", name: "maxSpots", widget: "number", value_type: "int", min: 1, max: 50}
              - {label: "Attiva", name: "active", widget: "boolean", default: true}
              - {label: "Frequenza", name: "frequency", widget: "select", options: ["settimanale", "mensile"], default: "settimanale", required: false, hint: "Mensile = un appuntamento al mese: nelle pagine viene segnalato così."}
              - {label: "Descrizione", name: "desc", widget: "text"}

      - name: "events"
        label: "Gestione Eventi"
        file: "events.json"
        fields:
          - name: "events"
            label: "Lista Eventi"
            widget: "list"
            fields:
              - {label: "Titolo", name: "title", widget: "string"}
              - {label: "Data (es. 24 Maggio - Ore 18:00)", name: "date", widget: "string", hint: "Per il riconoscimento automatico della data nella SEO, includi sempre giorno + mese in italiano e — se possibile — l'orario nel formato 'Ore HH:MM' o 'HH:MM'."}
              - {label: "Luogo", name: "location", widget: "string"}
              - {label: "Prezzo", name: "price", widget: "string"}
              - {label: "Attivo", name: "active", widget: "boolean", default: true}
              - {label: "Link Stripe", name: "stripeLink", widget: "string", required: false}
              - {label: "Locandina", name: "image", widget: "image"}
              - {label: "Descrizione", name: "desc", widget: "text"}
              - label: "Date precise (per Google e per il calendario)"
                name: "dates"
                widget: "list"
                required: false
                hint: "Una riga per ogni incontro. Se compilate, valgono queste e non il testo del campo Data."
                fields:
                  - {label: "Giorno", name: "day", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false}
                  - {label: "Inizio (HH:MM)", name: "start", widget: "string", required: false}
                  - {label: "Fine (HH:MM)", name: "end", widget: "string", required: false}
                  - {label: "Etichetta (es. Durga)", name: "label", widget: "string", required: false}
              - label: "Quote (una riga per formula)"
                name: "offers"
                widget: "list"
                required: false
                hint: "Es. Singolo incontro 45, Intero percorso 115. Se compilate, valgono queste e non il campo Prezzo."
                fields:
                  - {label: "Nome", name: "name", widget: "string"}
                  - {label: "Prezzo in euro", name: "price", widget: "number", value_type: "float", min: 0}

  - name: "blog"
    label: "Blog (articoli)"
    folder: "blog/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Data di pubblicazione", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "Pubblicato", name: "published", widget: "boolean", default: false}
      - {label: "Categoria", name: "category", widget: "select", options: ["gravidanza", "anukalana", "pratica", "genova", "salute"], required: true, hint: "Determina la URL: /blog/<categoria>/<slug>/"}
      - {label: "Sommario (max 200 caratteri)", name: "summary", widget: "text"}
      - {label: "Immagine di copertina", name: "cover", widget: "image", required: false}
      - {label: "URL video YouTube (opzionale)", name: "youtube_url", widget: "string", required: false, hint: "Incolla l'URL completo del video YouTube quando disponibile, es. https://www.youtube.com/watch?v=ABC123. Lascia vuoto se non c'è video."}
      - {label: "Tags", name: "tags", widget: "list", default: ["yoga"], required: false}
      - {label: "Contenuto", name: "body", widget: "markdown"}
